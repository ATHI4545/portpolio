<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="48" height="48">
  <defs>
    <linearGradient id="aGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066cc;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Letter A -->
  <g filter="url(#shadow)">
    <!-- Left stroke -->
    <path d="M 20 90 L 50 10 L 50 10" stroke="url(#aGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Right stroke -->
    <path d="M 50 10 L 80 90" stroke="url(#aGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
    
    <!-- Horizontal bar -->
    <line x1="32" y1="50" x2="68" y2="50" stroke="url(#aGradient)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>